<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repeated poles · Live Python · Xu Chen</title>
<style>*{box-sizing:border-box}body{margin:0;font:17px/1.3 system-ui;color:#242231;background:white}main{max-width:1200px;margin:auto;padding:14px 20px;border-top:6px solid #4b2e83}header{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #b7a57a;padding-bottom:8px}h1{font-size:24px;color:#4b2e83;margin:0}.controls{display:flex;align-items:center;gap:12px}input{width:170px;accent-color:#4b2e83}button{font:inherit;padding:7px 14px;background:#4b2e83;color:white;border:0;border-radius:4px}button:disabled,input:disabled{opacity:.5}.panels{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;padding-top:10px}svg{width:100%;height:250px}pre{font:15px/1.4 Menlo,monospace;margin:0;padding:12px;background:#f5f3f8;border-left:4px solid #b7a57a;white-space:pre-wrap}.result{font-variant-numeric:tabular-nums;color:#4b2e83;font-weight:600}p{margin:6px 0}footer{font-size:12px;color:#65583b;display:flex;justify-content:space-between}a{color:#4b2e83}#status{font-size:13px} @media(max-width:650px){header{display:block}.panels{grid-template-columns:1fr}.controls{margin-top:10px}}</style>
<main><header><h1>Repeated poles: compute with Python</h1><div class="controls"><label for="order">n = <output id="n-value">20</output></label><input id="order" aria-label="Polynomial order n" type="range" min="2" max="40" step="1" value="20" disabled><button id="run" disabled>Run Python</button></div></header>
<div class="panels"><svg id="map" role="img" aria-label="Computed roots and exact repeated pole" viewBox="0 0 600 270"></svg><div><pre id="code"></pre><p class="result" id="result"></p><p>Exact: every root of (s + 1)<sup id="power">20</sup> is −1.</p><p>Root locations are sensitive near a repeated pole; the numerical cluster depends on the platform.</p></div></div>
<p id="status" role="status">Initial reference plot · loading live Python / NumPy…</p><footer><span>Author: Xu Chen · University of Washington</span><a href="https://github.com/xchen-me/intro-to-controls-w-python/blob/main/demos/repeated_poles_app.py" target="_blank" rel="noopener">Python source on GitHub</a></footer></main>
<script>
const source=__PYTHON_SOURCE__,initial=__INITIAL_DATA__,$=id=>document.getElementById(id);let worker,ready=false,serial=0,timer;
function showCode(n){$('n-value').textContent=n;$('power').textContent=n;$('code').textContent=`from math import comb\nimport numpy as np\n\nn = ${n}\na = [comb(n, k) for k in range(n+1)]\np = np.roots(a)\nprint(max(abs(p + 1)))`;}
function draw(data){showCode(data.n);const radius=Math.max(.12,...data.roots.flatMap(p=>[Math.abs(p[0]+1),Math.abs(p[1])]))*1.2,x=v=>65+(v+1+radius)*460/(2*radius),y=v=>225-(v+radius)*200/(2*radius);let svg='<rect x="0" y="0" width="600" height="270" fill="white"/>';
for(let i=0;i<=4;i++){let v=-radius+2*radius*i/4;svg+=`<path d="M${65+i*115} 25V225 M65 ${25+i*50}H525" stroke="#ddd" fill="none"/><text x="${65+i*115}" y="245" text-anchor="middle" font-size="13">${(v-1).toFixed(2)}</text><text x="55" y="${y(v)+4}" text-anchor="end" font-size="13">${v.toFixed(2)}</text>`;}
svg+=`<path d="M${x(-1)} 25V225 M65 ${y(0)}H525" stroke="#b7a57a"/><circle cx="${x(-1)}" cy="${y(0)}" r="7" fill="none" stroke="#9a7629" stroke-width="2"/>`;
for(const [r,i]of data.roots)svg+=`<path d="M${x(r)-4} ${y(i)-4}l8 8m-8 0l8 -8" stroke="#4b2e83" stroke-width="2"/>`;
svg+='<text x="300" y="265" text-anchor="middle" font-size="14">Re(s)</text><text x="12" y="15" font-size="14">Im(s)</text><text x="300" y="15" text-anchor="middle" font-size="14">× computed roots     ○ exact root −1</text>';$('map').innerHTML=svg;$('result').textContent=`max |p + 1| = ${data.max_displacement.toPrecision(5)}`;window.demoResult=data;}
function run(){if(!ready)return;const n=Number($('order').value);showCode(n);$('status').textContent=`Computing n = ${n} in live Python…`;worker.postMessage({id:++serial,n});}
function start(){ready=false;$('run').disabled=true;$('order').disabled=true;worker?.terminate();
const workerSource=`importScripts('https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js');let py;async function start(){try{py=await loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/'});await py.loadPackage('numpy');await py.runPythonAsync(${JSON.stringify(source)});postMessage({ready:true});}catch(e){postMessage({error:String(e)});}}onmessage=async e=>{try{const t=performance.now();py.globals.set('lecture_n',e.data.n);const data=JSON.parse(await py.runPythonAsync('json.dumps(calculate(lecture_n))'));postMessage({id:e.data.id,data,ms:performance.now()-t});}catch(e){postMessage({error:String(e)});}};start();`;
const url=URL.createObjectURL(new Blob([workerSource],{type:'text/javascript'}));worker=new Worker(url);URL.revokeObjectURL(url);
function fail(){ready=false;$('status').textContent='Live Python could not load. Internet access is needed for Pyodide. The displayed plot is the initial reference result.';$('run').disabled=false;$('run').textContent='Retry Python';}
worker.onerror=fail;worker.onmessage=e=>{const m=e.data;if(m.error){fail();return}if(m.ready){ready=true;$('run').textContent='Run Python';$('run').disabled=false;$('order').disabled=false;run();return}if(m.id!==serial)return;draw(m.data);$('status').textContent=`Live Python / NumPy ${m.data.numpy_version} · n=${m.data.n} · ${m.ms.toFixed(1)} ms · computed now in this browser`;};}
$('order').oninput=()=>{showCode($('order').value);clearTimeout(timer);timer=setTimeout(run,100)};$('run').onclick=()=>ready?run():start();draw(initial);start();
</script></html>
